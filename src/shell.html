<title>Contrail Airline Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen ops console. Status strip on top, live route map in the middle,
   thumb-reach tab bar at the bottom; details open as a bottom sheet over the map. Single dark look by choice. */
:root {
  --ink: #0a1120; --panel: #111b2d; --panel-2: #172540; --line: #24344f; --coast: #2b3f60;
  --text: #e7edf6; --mute: #8d9cb6; --amber: #f4b13e; --amber-ink: #1d1404; --good: #52d18e; --bad: #ef6f6c; --violet: #c7b6ff;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--ink); color: var(--text); font-family: var(--font-body); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

/* status strip */
.top { background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 10px; padding-block: 8px; min-height: 52px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.brand .face { flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flap { display: flex; gap: 2px; font-family: var(--font-data); font-weight: 500; font-size: 15px; }
.flap span { background: #05090f; color: var(--amber); padding: 3px 4px; border-radius: 3px; position: relative; min-width: 1.1em; text-align: center; }
.flap span::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid rgba(255,255,255,.08); }
.flap .gap { background: none; min-width: .35em; padding: 0; }
.flap .gap::after { display: none; }
.flip span { animation: flip .5s steps(4) both; }
@keyframes flip { 0% { transform: scaleY(.1); color: transparent; } 60% { transform: scaleY(1); color: #fff3d6; } }
.cash { text-align: right; line-height: 1.1; }
.cash b { display: block; font-family: var(--font-data); font-weight: 500; font-size: 15px; }
.cash small { color: var(--mute); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.pips { display: flex; gap: 4px; margin-top: 3px; justify-content: flex-end; }
.pip { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
.pip.off { background: transparent; border: 1px solid var(--mute); }

/* stage */
.stage { position: relative; overflow: hidden; min-height: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
.mapctl { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 52px; display: flex; flex-direction: column; gap: 8px; }
.mapctl button[aria-pressed="true"] { border-color: var(--good); color: var(--good); }
.mapctl button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(17,27,45,.92); font-size: 20px; line-height: 1; cursor: pointer; }
.regionbar { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.regionbar button { flex: 1 0 auto; border: 1px solid var(--line); background: rgba(10,17,32,.85); border-radius: 999px; padding: 4px 8px; font-family: var(--font-data); font-size: 11px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--mute); }
.regionbar button b { color: var(--text); font-weight: 500; }
.coach { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; width: min(300px, calc(100% - 24px)); background: rgba(10,17,32,.94); border: 1px solid var(--coast); border-radius: var(--r); padding: 10px 12px; font-size: 13px; z-index: 3; }
.coach ol { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
.coach li { display: flex; gap: 8px; color: var(--mute); }
.coach li.done { color: var(--good); text-decoration: line-through; text-decoration-color: rgba(82,209,142,.4); }
.coach li.now { color: var(--text); }
.coach li i { font-style: normal; width: 14px; flex: none; }
.coach .row button { border: 0; background: none; color: var(--mute); cursor: pointer; font-size: 12px; padding: 2px 4px; }

.panel { position: absolute; inset: 0; overflow-y: auto; background: var(--ink); padding-block: 16px 96px; -webkit-overflow-scrolling: touch; }
.panel-in, .sheet-in { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 6px 0 0; }
p { margin: 0; line-height: 1.5; }
.muted { color: var(--mute); }
.small { font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* bottom sheet */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 80%; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.45); padding-block: 8px 20px; z-index: 5; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 4px; }
.sh-head { display: flex; align-items: flex-start; gap: 12px; }
.sh-head .t { flex: 1; min-width: 0; }
.code { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: .95; letter-spacing: .03em; }
.sub { color: var(--mute); font-size: 14px; margin-top: 4px; }
.x { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-size: 18px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); display: inline-flex; align-items: center; gap: 6px; background: none; }
button.chip { cursor: pointer; padding: 6px 10px; }
.chip.on, .chip.hub { border-color: var(--amber); color: var(--amber); }
.chip.ev { border-color: #5a4a8a; color: var(--violet); }
.chip.warn { border-color: #6b2f33; color: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat small, .lbl { display: block; color: var(--mute); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.stat b { font-family: var(--font-data); font-weight: 500; font-size: 15px; }
.meter { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--amber); }
.row { display: flex; align-items: center; gap: 10px; }
.row > .grow, .grow { flex: 1; min-width: 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.kv .num { text-align: right; }
.kv .tot { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; }

.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 500; min-height: 44px; text-align: center; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 600; }
.btn.danger { border-color: #6b2f33; color: var(--bad); }
.btn.ghost { background: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1 1 120px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; padding: 10px 6px; min-height: 42px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); font-weight: 600; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.stepper button { width: 44px; height: 42px; border: 0; background: var(--panel-2); font-size: 20px; cursor: pointer; }
.stepper button:disabled { opacity: .35; }
.stepper output { min-width: 44px; text-align: center; font-family: var(--font-data); font-size: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.note { font-size: 12px; color: var(--mute); }
input[type=text] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 10px 12px; font: inherit; min-height: 44px; width: 100%; }
input[type=range] { width: 100%; accent-color: var(--amber); height: 32px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 10px; cursor: pointer; min-width: 0; }
.tile b { display: block; font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.tile small { color: var(--mute); font-size: 12px; display: block; }
.tile[aria-pressed="true"] { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.tile:disabled { opacity: .4; cursor: not-allowed; }
.forecast { background: #0c1527; border: 1px dashed var(--coast); border-radius: var(--r); padding: 12px; }
.lf { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; }
.lf i { display: block; height: 100%; }
.err { color: var(--bad); font-size: 13px; }
.good { color: var(--good); } .bad { color: var(--bad); }
.tag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; background: #3a2a07; color: var(--amber); font-family: var(--font-body); font-weight: 600; }
.tag.blue { background: #0f2c3a; color: #7fd3f0; }
.tag.grey { background: var(--panel-2); color: var(--mute); }

.rt { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; }
.rt .pair { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: .03em; }
.rt .meta { color: var(--mute); font-size: 13px; grid-column: 1 / -1; }
.rt .lf { grid-column: 1 / -1; }
.plane { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
.plane .spec { color: var(--mute); font-size: 13px; }
.plane .row .btn { flex: 1 1 110px; }
.pname { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: .02em; }
.regions { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.reg { background: var(--panel-2); border-radius: 8px; padding: 8px; font-size: 12px; min-width: 0; border-top: 3px solid var(--line); }
.reg b { display: block; font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ok { color: var(--good); } .no { color: var(--mute); }
.plots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.plot { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12px; min-height: 48px; min-width: 0; }
.plot.taken { border-style: solid; background: var(--panel-2); }
.plot b { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person { display: flex; gap: 12px; align-items: flex-start; }
.person .face { flex: none; }
.quote { font-size: 14px; line-height: 1.45; }
.quote .who { font-size: 12px; color: var(--mute); margin-bottom: 2px; }
.rival { border-left: 4px solid var(--line); }

/* nav */
.nav { background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { display: flex; align-items: stretch; gap: 2px; padding-block: 6px; max-width: 760px; margin: 0 auto; }
.tab { flex: 1; border: 0; background: none; color: var(--mute); padding: 6px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; min-height: 48px; border-radius: 8px; position: relative; min-width: 0; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.tab[aria-selected="true"] { color: var(--amber); }
.tab .badge { position: absolute; top: 2px; right: calc(50% - 18px); background: var(--bad); color: #fff; font-size: 10px; border-radius: 999px; min-width: 16px; height: 16px; line-height: 16px; padding: 0 4px; }
.next { flex: 1.4; border: 0; border-radius: 10px; background: var(--amber); color: var(--amber-ink); font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .03em; cursor: pointer; line-height: 1.05; padding: 4px 6px; white-space: nowrap; }
.next small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 10px; letter-spacing: .08em; opacity: .8; }

/* modal / toast */
.modal { position: fixed; inset: 0; background: rgba(4,8,16,.84); z-index: 20; overflow-y: auto; display: flex; padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); }
.modal-card { margin: auto; width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.board { background: #05090f; border-radius: 10px; padding: 12px; font-family: var(--font-data); font-size: 13px; color: var(--amber); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
.board .h { grid-column: 1/-1; color: var(--mute); letter-spacing: .12em; font-size: 11px; text-transform: uppercase; }
.board .w { color: #f3e2bd; }
.board.flip > span { animation: flip .45s steps(3) both; }
.news { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.news li { font-size: 14px; line-height: 1.4; padding-left: 14px; position: relative; }
.news li::before { content: ""; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; background: var(--mute); border-radius: 1px; }
.news li.good::before { background: var(--good); } .news li.bad::before { background: var(--bad); } .news li.hist::before { background: var(--violet); }
.hero-title { font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: .9; letter-spacing: .02em; margin: 0; }
.hero-title span { color: var(--amber); }
.eras { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.era { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.era b { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1; color: var(--amber); }
.era strong { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: .02em; }
.era small { color: var(--mute); font-size: 12px; line-height: 1.35; }
.era[aria-pressed="true"] { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.homes { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.home { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px; cursor: pointer; text-align: left; min-width: 0; }
.home b { display: block; font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: .04em; }
.home small { color: var(--mute); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home[aria-pressed="true"] { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.ceremony { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.award { background: var(--panel-2); border-radius: 10px; padding: 10px; border-top: 4px solid var(--line); animation: rise .5s both; min-width: 0; }
.award b { font-family: var(--font-display); font-size: 17px; font-weight: 600; display: block; }
.award span { font-size: 12px; color: var(--mute); display: block; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: #05090f; border: 1px solid var(--coast); color: var(--text); padding: 10px 14px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
details > summary { cursor: pointer; color: var(--mute); font-size: 14px; list-style-position: inside; }
details[open] > summary { margin-bottom: 10px; }
.spark { width: 100%; height: 64px; display: block; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: #8d9cb6; font-family: var(--font-data); font-size: 9px; }
.radar text { font-family: var(--font-body); font-size: 10px; fill: #c9d6ea; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--mute); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.subtabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.subtabs button { flex: none; border: 1px solid var(--line); background: none; color: var(--mute); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; min-height: 36px; }
.subtabs button[aria-pressed="true"] { background: var(--text); color: var(--ink); border-color: var(--text); font-weight: 600; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--mute); font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td.n, .tbl th.n { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.tbl tr[data-act] { cursor: pointer; }
.scroll-x { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.rating { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: .03em; }
.rank { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; align-items: center; font-size: 12px; }
.rank .bars { display: flex; flex-direction: column; gap: 3px; }
.rank .bars i { display: block; height: 6px; border-radius: 3px; min-width: 2px; }
.ms { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ms div { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--mute); border-left: 3px solid var(--line); min-width: 0; }
.ms div.on { border-left-color: var(--amber); color: var(--text); }
.ms b { display: block; font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: .02em; }
.advice { background: #0c1f19; border: 1px solid #23573f; border-radius: var(--r); padding: 12px; }
.filters { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 420px) { .next { font-size: 14px; } .code { font-size: 34px; } .hero-title { font-size: 44px; } }
@media (min-width: 900px) {
  .sheet { left: auto; right: 16px; bottom: 16px; width: 440px; border-radius: 16px; border: 1px solid var(--line); max-height: calc(100% - 32px); }
}
@media (prefers-reduced-motion: reduce) { .sheet, .flip span, .board.flip > span, .award { animation: none; } }
</style>

<div id="app">
  <header class="top"><div class="top-in gutter">
    <div class="brand" id="brand"></div>
    <div class="flap" id="flap" aria-label="Current quarter"></div>
    <div class="cash"><small>Cash</small><b id="cash">$0</b><div class="pips" id="pips"></div></div>
  </div></header>

  <main class="stage" id="stage">
